name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, formatting and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore NullByte.slnx

      - name: Verify formatting
        run: dotnet format NullByte.slnx --verify-no-changes --no-restore --severity warn

      - name: Build solution
        run: dotnet build NullByte.slnx --configuration Release --no-restore -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest

      - name: Run tests
        run: dotnet test --solution NullByte.slnx --configuration Release --no-build --no-restore

  vscode-extension:
    name: VS Code extension build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: NullByte.vscode

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NullByte.vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and run tests
        run: npm test
